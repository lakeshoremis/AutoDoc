services:
  - type: web
    name: lakeshore-grand-submission-portal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HR_API_TOKEN
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: employee-photos
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: RATELIMIT_STORAGE_URI
        sync: false
