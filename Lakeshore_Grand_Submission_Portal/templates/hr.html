<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lakeshore Grand | HR Inbox</title><style>
:root{--navy:#19182f;--gold:#bd9130;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#25253b;font:14px Arial,sans-serif}.top{background:var(--navy);color:white;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}.top b{font:24px Georgia,serif}.wrap{max-width:1200px;margin:26px auto;padding:0 18px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:white;padding:16px;border-radius:12px;margin-bottom:18px}.bar input,.bar select{padding:10px;border:1px solid var(--line);border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--gold);font-weight:700;cursor:pointer}.btn.dark{background:var(--navy);color:white}.btn.red{background:#fee2e2;color:#991b1b}.tablebox{background:white;border-radius:12px;overflow:auto;box-shadow:0 6px 22px #1111}table{border-collapse:collapse;width:100%;min-width:900px}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee;vertical-align:middle}th{background:#fafafa;color:#666;font-size:11px;text-transform:uppercase;letter-spacing:.5px}.status{font-size:11px;font-weight:700;padding:5px 8px;border-radius:20px;background:#fef3c7}.status.approved{background:#dcfce7}.status.rejected{background:#fee2e2}.status.generated{background:#dbeafe}.photo{width:44px;height:54px;object-fit:cover;border-radius:6px;background:#eee}.muted{color:#777;font-size:12px}.hidden{display:none!important}.login{max-width:430px;margin:70px auto;background:white;padding:25px;border-radius:14px;box-shadow:0 8px 30px #0001}.login input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:12px 0}.msg{padding:12px;background:#fff1f2;color:#9f1239;border-radius:8px;margin:10px 0}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;padding:45px;color:#777}
</style></head><body><header class="top"><b>Lakeshore Grand · HR Inbox</b><span>Private HR dashboard</span></header><section id="login" class="login"><h2>HR access</h2><p class="muted">Enter the HR access token supplied during deployment. Department heads do not use this dashboard.</p><input id="token" type="password" placeholder="HR access token" autocomplete="current-password"><button class="btn dark" onclick="connect()">Open HR Inbox</button><div id="loginmsg"></div></section><main id="app" class="wrap hidden"><div class="bar"><b>Employee requests</b><select id="filter" onchange="load()"><option value="all">All statuses</option><option>pending</option><option>approved</option><option>rejected</option><option>generated</option></select><input id="search" placeholder="Search name, ID or reference" oninput="render()"><button class="btn" onclick="load()">Refresh</button><button class="btn dark" onclick="logout()">Lock dashboard</button><span id="count" class="muted"></span></div><div class="tablebox"><table><thead><tr><th>Photo</th><th>Employee / Reference</th><th>Department / Role</th><th>Submitted by</th><th>Card request</th><th>Status</th><th>HR action</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No submissions found.</div></div></main>
<script>
let auth='',items=[];function headers(){return {'Authorization':'Bearer '+auth,'Content-Type':'application/json'}}async function connect(){auth=document.getElementById('token').value.trim();try{const r=await fetch('/api/hr/submissions',{headers:headers()});if(!r.ok)throw Error('Access denied or service unavailable');items=await r.json();document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}catch(e){document.getElementById('loginmsg').className='msg';document.getElementById('loginmsg').textContent=e.message;auth=''}}function logout(){auth='';items=[];document.getElementById('token').value='';document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}async function load(){if(!auth)return;const r=await fetch('/api/hr/submissions?status='+encodeURIComponent(document.getElementById('filter').value),{headers:headers()});if(!r.ok){alert('Could not refresh inbox');return}items=await r.json();render()}async function photoUrl(id){const r=await fetch('/api/hr/submissions/'+id+'/photo',{headers:headers()});if(!r.ok)return '';return (await r.json()).url}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=document.getElementById('search').value.toLowerCase();const list=items.filter(x=>[x.employee_name,x.employee_id,x.reference,x.employee_department,x.designation].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=list.length+' request(s)';const rows=document.getElementById('rows');rows.innerHTML='';document.getElementById('empty').classList.toggle('hidden',list.length>0);list.forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td><img class="photo" id="p-${x.id}" alt="Employee"></td><td><b>${esc(x.employee_name)}</b><div class="muted">${esc(x.reference)} · ${esc(x.employee_id||'ID not assigned')}</div></td><td>${esc(x.designation)}<div class="muted">${esc(x.employee_department)} · Blood: ${esc(x.blood_group)}</div></td><td>${esc(x.submitter_name)}<div class="muted">${esc(x.submitter_department)}</div></td><td>${esc(x.card_request)}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span></td><td><div class="actions"><button class="btn" onclick="change('${x.id}','approved')">Approve</button><button class="btn red" onclick="change('${x.id}','rejected')">Reject</button><button class="btn dark" onclick="change('${x.id}','generated')">Generated</button><button class="btn dark" onclick="editRecord('${x.id}')">Edit</button></div></td>`;rows.appendChild(tr);photoUrl(x.id).then(u=>{const im=document.getElementById('p-'+x.id);if(im&&u)im.src=u})})}async function editRecord(id){const x=items.find(v=>v.id===id);if(!x)return;const employee_name=prompt('Employee full name:',x.employee_name);if(employee_name===null)return;const designation=prompt('Designation:',x.designation);if(designation===null)return;const employee_department=prompt('Employee department:',x.employee_department);if(employee_department===null)return;const employee_id=prompt('Employee ID (leave blank if not assigned):',x.employee_id||'');if(employee_id===null)return;const blood_group=prompt('Blood group:',x.blood_group||'Not provided');if(blood_group===null)return;const card_request=prompt('Card request: id, business, or both',x.card_request);if(card_request===null)return;const r=await fetch('/api/hr/submissions/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({employee_name,designation,employee_department,employee_id, blood_group,card_request})});if(!r.ok){alert('Could not save edited details');return}await load()}async function change(id,status){let note='';if(status==='rejected'||status==='generated')note=prompt('Optional HR note:')||'';const r=await fetch('/api/hr/submissions/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({status,note})});if(!r.ok){alert('Could not update request');return}await load()}document.getElementById('token').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});
</script></body></html>
